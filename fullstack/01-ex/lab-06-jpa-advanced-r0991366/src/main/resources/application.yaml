server:
  port: 3000

spring:
  application:
    name: lab6
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
    encoding: UTF-8

  datasource:
    url: jdbc:postgresql://localhost:5432/lab6
    username: postgres
    password: postgres

logging:
  level:
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG