server:
  port: 3000

spring:
  application:
    name: lab5
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
    encoding: UTF-8

  datasource:
    url: jdbc:postgresql://localhost:5432/lab5
    username: postgres
    password: postgres
